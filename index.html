<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATLAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="./atlas-logo.png">
<style>
  :root{
    color-scheme: dark;
    --bg:#0A0C0F;
    --surface:#14171B;
    --surface-2:#1B1F24;
    --surface-3:#20252B;
    --border:#23282E;
    --border-strong:#323941;
    --text:#F1F3F5;
    --text-dim:#8B9199;
    --text-faint:#565D65;
    --accent:#FF5A1F;
    --accent-2:#FF7A45;
    --accent-soft:rgba(255,90,31,0.13);
    --accent-soft-strong:rgba(255,90,31,0.22);
    --success:#2DD4BF;
    --success-soft:rgba(45,212,191,0.14);
    --danger:#E5484D;
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:22px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft-strong);}

  #app{max-width:560px; margin:0 auto; padding:0 20px 120px; position:relative;}
  @media (min-width: 860px){
    #app{max-width:920px; padding:0 40px 120px;}
  }

  /* ---- Top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0 18px;
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid transparent;
  }
  .wordmark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.14em;
    display:flex; align-items:center; gap:10px;
  }
  .wordmark .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none;}
  .app-icon-slot{width:28px; height:28px; border-radius:8px; flex:none; display:none;}
  .back-btn{
    display:flex; align-items:center; gap:6px;
    background:none; border:none; color:var(--text-dim);
    font-size:14px; font-weight:600; padding:8px 4px; border-radius:8px;
  }
  .back-btn:active{background:var(--surface-2);}
  .back-btn svg{width:18px; height:18px;}

  /* ---- Focus ---- */
  button:focus-visible, a:focus-visible, input:focus-visible, .pill-btn:focus-visible{
    outline:2px solid var(--accent-2); outline-offset:2px;
  }

  /* ---- Sections / headings ---- */
  .view{animation:viewIn .28s ease both;}
  @keyframes viewIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  h1.page-title{
    font-family:var(--font-display); font-weight:700; font-size:26px;
    margin:4px 0 22px; letter-spacing:-0.01em;
  }
  .section-label{
    font-size:13px; color:var(--text-dim); font-weight:500; margin:0 0 12px;
  }

  /* ---- Home hero / progress ring ---- */
  .hero{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:28px 22px 24px;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    margin-bottom:22px;
  }
  .hero-date{color:var(--text-dim); font-size:14px; margin-bottom:2px;}
  .hero-day{
    font-family:var(--font-display); font-weight:600; font-size:19px; margin-bottom:20px;
  }
  .ring-wrap{position:relative; width:198px; height:198px; margin-bottom:20px;}
  .ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:var(--surface-3); stroke-width:12;}
  .ring-fill{fill:none; stroke:var(--accent); stroke-width:12; stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-pct{font-family:var(--font-display); font-weight:700; font-size:40px; line-height:1;}
  .ring-sub{color:var(--text-dim); font-size:13px; margin-top:6px;}
  .hero-cta{
    width:100%;
    background:var(--accent);
    color:#151006;
    border:none; border-radius:var(--radius-md);
    padding:15px 18px; font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s ease, opacity .15s ease;
  }
  .hero-cta:active{transform:scale(0.98); opacity:0.92;}
  .hero-cta svg{width:18px; height:18px;}

  /* ---- Quick grid ---- */
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:26px;
  }
  @media (min-width:860px){ .grid{grid-template-columns:repeat(3,1fr);} }
  .tile{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px;
    display:flex; flex-direction:column; align-items:flex-start; gap:14px;
    text-align:left;
    transition:border-color .15s ease, transform .15s ease;
    min-height:96px;
  }
  .tile:active{transform:scale(0.98); border-color:var(--border-strong);}
  .tile-icon{
    width:34px; height:34px; border-radius:9px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
  }
  .tile-icon svg{width:18px; height:18px;}
  .tile-label{font-weight:600; font-size:14.5px; line-height:1.3;}
  .tile-value{color:var(--text-dim); font-size:12.5px; margin-top:4px; line-height:1.3;}

  /* ---- Calendar ---- */
  .cal-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:20px 18px 18px; margin-bottom:20px;
  }
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-title{font-family:var(--font-display); font-weight:600; font-size:15px;}
  .cal-nav{display:flex; gap:4px;}
  .cal-nav button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); display:flex; align-items:center; justify-content:center;
  }
  .cal-nav button svg{width:15px; height:15px;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px;}
  .cal-weekdays span{text-align:center; font-size:11px; color:var(--text-faint); font-weight:600;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); row-gap:6px;}
  .cal-cell{display:flex; align-items:center; justify-content:center; padding:3px 0;}
  .cal-dot{
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; color:var(--text-dim); position:relative;
    border:1.5px solid transparent;
  }
  .cal-dot.today{border-color:var(--border-strong); color:var(--text); font-weight:700;}
  .cal-dot.outline{border-color:var(--accent); color:var(--text);}
  .cal-dot.full{background:var(--accent); color:#151006; font-weight:700;}
  .cal-dot.empty{visibility:hidden;}
  .cal-legend{display:flex; gap:16px; margin-top:16px; flex-wrap:wrap;}
  .cal-legend-item{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim);}
  .legend-swatch{width:12px; height:12px; border-radius:50%; flex:none;}
  .legend-swatch.full{background:var(--accent);}
  .legend-swatch.outline{border:1.5px solid var(--accent); background:transparent;}
  .legend-swatch.empty{border:1.5px solid var(--border-strong); background:transparent;}

  /* ---- Lists (day/exercise rows) ---- */
  .list{display:flex; flex-direction:column; gap:10px; margin-bottom:20px;}
  .row-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:15px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .row-main{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .row-title{font-weight:600; font-size:15px;}
  .row-sub{color:var(--text-dim); font-size:12.5px;}
  .row-chev{color:var(--text-faint); flex:none;}
  .row-chev svg{width:18px; height:18px;}
  .day-btn{width:100%; text-align:left; background:none; border:none; color:inherit; display:flex; align-items:center; justify-content:space-between; gap:12px;}

  /* ---- Empty state ---- */
  .empty-state{
    border:1px dashed var(--border-strong); border-radius:var(--radius-md);
    padding:30px 18px; text-align:center; color:var(--text-dim); font-size:13.5px;
    margin-bottom:16px;
  }

  /* ---- Section header w/ edit toggle ---- */
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .edit-toggle{
    display:flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:8px 13px; border-radius:20px; font-size:13px; font-weight:600;
  }
  .edit-toggle.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2);}
  .edit-toggle svg{width:14px; height:14px;}

  /* ---- Exercise / item rows ---- */
  .ex-row{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:15px 16px; margin-bottom:10px;
  }
  .ex-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .ex-name{font-weight:600; font-size:15px;}
  .ex-meta{color:var(--text-dim); font-size:12.5px; margin-top:2px;}
  .ex-del{background:none; border:none; color:var(--text-faint); padding:6px;}
  .ex-del svg{width:16px; height:16px;}
  .ex-del:active{color:var(--danger);}
  .set-pills{display:flex; gap:8px; flex-wrap:wrap;}
  .set-pill{
    width:38px; height:38px; border-radius:10px; border:1.5px solid var(--border-strong);
    background:var(--surface-2); color:var(--text-dim); font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .set-pill.done{background:var(--accent); border-color:var(--accent); color:#151006;}

  /* ---- Inline edit form fields ---- */
  .field-row{display:flex; gap:8px; margin-bottom:8px;}
  .field{flex:1; min-width:0;}
  .field label{display:block; font-size:11px; color:var(--text-faint); margin-bottom:5px; font-weight:600;}
  .field input, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
    border-radius:8px; padding:10px 11px; font-size:14px;
  }
  .field input:focus, .field select:focus{border-color:var(--accent); outline:none;}
  .type-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .type-toggle button{
    flex:1; padding:9px; border-radius:8px; border:1.5px solid var(--border-strong);
    background:var(--surface-2); color:var(--text-dim); font-weight:600; font-size:13px;
  }
  .type-toggle button.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2);}

  .add-btn{
    width:100%; padding:14px; border-radius:var(--radius-md); border:1.5px dashed var(--border-strong);
    background:transparent; color:var(--text-dim); font-weight:600; font-size:14px;
    display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px;
  }
  .add-btn:active{border-color:var(--accent); color:var(--accent-2);}
  .add-btn svg{width:16px; height:16px;}

  .save-bar{margin-top:6px;}
  .save-btn{
    width:100%; padding:15px; border-radius:var(--radius-md); border:none;
    background:var(--accent); color:#151006; font-weight:700; font-size:15px;
  }
  .save-btn:active{opacity:.9;}

  /* ---- Day chip strip (stretches overview) ---- */
  .chip-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
  @media (min-width:860px){ .chip-grid{grid-template-columns:repeat(4,1fr);} }

  /* ---- Measurement value buttons ---- */
  .measure-row{display:flex; align-items:baseline; justify-content:space-between; width:100%;}
  .measure-val{font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--accent-2);}
  .measure-val.empty{color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:13px;}

  /* ---- Modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(4,5,6,0.66); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  @media (min-width:640px){ .modal-backdrop{align-items:center;} }
  .modal{
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:20px 20px 0 0;
    width:100%; max-width:440px; padding:22px 20px 26px;
    transform:translateY(24px); transition:transform .25s cubic-bezier(.4,0,.2,1);
    max-height:82vh; overflow-y:auto;
  }
  @media (min-width:640px){ .modal{border-radius:20px; margin:0 16px;} }
  .modal-backdrop.open .modal{transform:translateY(0);}
  .modal-title{font-family:var(--font-display); font-weight:700; font-size:17px; margin-bottom:16px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-btn{flex:1; padding:13px; border-radius:10px; font-weight:700; font-size:14px; border:none;}
  .modal-btn.primary{background:var(--accent); color:#151006;}
  .modal-btn.ghost{background:var(--surface-3); color:var(--text-dim); border:1px solid var(--border-strong);}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(10px);
    background:var(--surface-3); border:1px solid var(--border-strong); color:var(--text);
    padding:11px 18px; border-radius:30px; font-size:13.5px; font-weight:600;
    z-index:200; opacity:0; transition:all .25s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .footer-note{text-align:center; color:var(--text-faint); font-size:11.5px; margin:26px 0 10px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================= ICONS ============================= */
const ICONS = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8V4z"/></svg>',
  dumbbell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M4 9l2.5-2.5M9 4l-2.5 2.5M20 15l-2.5 2.5M15 20l2.5-2.5"/><rect x="2" y="2" width="0" height="0"/><path d="M4.5 4.5l2 2M17.5 17.5l2 2"/></svg>',
  stretch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="1.8"/><path d="M12 8v6M12 8L6 11M12 8l6 3M12 14l-4 6M12 14l4 6"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s-6 5.5-6 10a6 6 0 0012 0c0-1.5-1-3-1-3s0 2-1.5 2c1-2 .5-5-1-7 0 1.5-1 2.5-1 2.5S13.5 5 12 3z"/></svg>',
  spine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="1.6"/><path d="M12 6.5v13M8.5 9h7M8 12.5h8M8.5 16h7"/></svg>',
  jaw: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8c0 5 2.5 9 7 11 4.5-2 7-6 7-11-1.5-2-4-3-7-3s-5.5 1-7 3z"/><path d="M9 14c1 1 2 1.4 3 1.4s2-.4 3-1.4"/></svg>',
  ruler: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M7 7v3M11 7v4M15 7v3M19 7v4"/></svg>',
  barbell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M2 10v4M7 7v10M20 9v6M22 10v4M17 7v10M7 12h10"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  chevLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chevRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
};

/* ============================= DATA LAYER ============================= */
const STORE_KEY = 'atlas_v1';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAYS_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function uid(){ return Math.random().toString(36).slice(2,10); }

function defaultData(){
  const emptyWeek = {}; DAYS.forEach(d=> emptyWeek[d] = []);
  const stretchWeek = {}; DAYS.forEach(d=> stretchWeek[d] = [{id:uid(), name:'Hamstring stretch', detail:'2 x 30s hold'}]);
  stretchWeek['Daily'] = [{id:uid(), name:'Neck rolls', detail:'2 x 10 reps'}];
  return {
    weekPlan: emptyWeek,
    dailyLogs: {},
    stretches: stretchWeek,
    warmup: [{id:uid(), name:'Jumping jacks', detail:'2 x 30s'}],
    posture: [{id:uid(), name:'Chin tucks', detail:'3 x 10 reps'}],
    jaw: [{id:uid(), name:'Resisted jaw hold', detail:'3 x 15s'}],
    height: null,
    weight: null,
    bodyMeasures: [{id:uid(), part:'Chest', cm:''}],
    weights: [{id:uid(), name:'Bench Press', type:'weight', weight:'20', sets:'3', reps:'8'}],
  };
}

let DATA = loadData();

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const def = defaultData();
    return Object.assign(def, parsed);
  }catch(e){ return defaultData(); }
}

function saveData(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
  catch(e){ showToast("Couldn't save — storage unavailable"); }
}

/* ============================= HELPERS ============================= */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekdayName(d){ const idx=(d.getDay()+6)%7; return DAYS[idx]; }
function todayDate(){ return new Date(); }

function dayCompletion(dateObj){
  const wd = weekdayName(dateObj);
  const plan = DATA.weekPlan[wd] || [];
  const totalSets = plan.reduce((s,ex)=> s + (parseInt(ex.sets)||0), 0);
  if(totalSets === 0) return {pct:null, totalSets:0, completedSets:0};
  const key = dateKey(dateObj);
  const log = DATA.dailyLogs[key] || {};
  let completed = 0;
  plan.forEach(ex=>{
    const done = Math.min(log[ex.id]||0, parseInt(ex.sets)||0);
    completed += done;
  });
  return {pct: Math.round((completed/totalSets)*100), totalSets, completedSets:completed};
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 1800);
}

/* ============================= ROUTER ============================= */
function nav(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function currentRoute(){
  const h = location.hash.slice(1) || '/home';
  const parts = h.split('/').filter(Boolean);
  return parts;
}

/* ============================= RENDER ROOT ============================= */
function render(){
  const app = document.getElementById('app');
  const parts = currentRoute();
  const root = parts[0] || 'home';

  let topbarHTML = '';
  let bodyHTML = '';

  if(root === 'home'){
    topbarHTML = topbar(false, 'ATLAS');
    bodyHTML = viewHome();
  } else if(root === 'today'){
    topbarHTML = topbar(true, "Today's session");
    bodyHTML = viewToday();
  } else if(root === 'workouts' && !parts[1]){
    topbarHTML = topbar(true, 'Workouts');
    bodyHTML = viewWorkoutsList();
  } else if(root === 'workouts' && parts[1]){
    const day = decodeURIComponent(parts[1]);
    topbarHTML = topbar(true, day);
    bodyHTML = viewWorkoutDay(day);
  } else if(root === 'stretches' && !parts[1]){
    topbarHTML = topbar(true, 'Stretches');
    bodyHTML = viewStretchesList();
  } else if(root === 'stretches' && parts[1]){
    const day = decodeURIComponent(parts[1]);
    topbarHTML = topbar(true, day + ' stretches');
    bodyHTML = viewSimpleList('stretches_'+day, DATA.stretches[day] || (DATA.stretches[day]=[]), {name:'Stretch name', detail:'e.g. 2 x 30s'}, ()=>saveData());
  } else if(root === 'warmup'){
    topbarHTML = topbar(true, 'Warm-up');
    bodyHTML = viewSimpleList('warmup', DATA.warmup, {name:'Exercise name', detail:'e.g. 2 x 30s'}, ()=>saveData());
  } else if(root === 'posture'){
    topbarHTML = topbar(true, 'Posture');
    bodyHTML = viewSimpleList('posture', DATA.posture, {name:'Exercise name', detail:'e.g. 3 x 10 reps'}, ()=>saveData());
  } else if(root === 'jaw'){
    topbarHTML = topbar(true, 'Jaw');
    bodyHTML = viewSimpleList('jaw', DATA.jaw, {name:'Exercise name', detail:'e.g. 3 x 15s'}, ()=>saveData());
  } else if(root === 'measurements' && !parts[1]){
    topbarHTML = topbar(true, 'Measurements');
    bodyHTML = viewMeasurements();
  } else if(root === 'measurements' && parts[1] === 'body'){
    topbarHTML = topbar(true, 'Body measurements');
    bodyHTML = viewBodyMeasures();
  } else if(root === 'weights'){
    topbarHTML = topbar(true, 'Lift log');
    bodyHTML = viewWeights();
  } else {
    topbarHTML = topbar(false, 'ATLAS');
    bodyHTML = viewHome();
  }

  app.innerHTML = topbarHTML + '<div class="view">' + bodyHTML + '</div>' + '<p class="footer-note">ATLAS · your progress, quietly tracked</p>';
  attachHandlers(root, parts);
}

function topbar(showBack, title){
  return `
  <div class="topbar">
    ${showBack
      ? `<button class="back-btn" id="btnBack">${ICONS.back}<span>Back</span></button>`
      : `<div class="wordmark"><span class="dot"></span>ATLAS<span class="app-icon-slot" id="appIconSlot"></span></div>`
    }
    ${showBack ? `<div class="wordmark" style="font-size:14px; letter-spacing:0.08em; color:var(--text-dim);">${escapeHTML(title)}</div>` : ''}
  </div>`;
}

function escapeHTML(s){
  return String(s==null? '': s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================= HOME VIEW ============================= */
let calViewDate = new Date();

function viewHome(){
  const now = todayDate();
  const comp = dayCompletion(now);
  const pct = comp.pct == null ? 0 : comp.pct;
  const r = 82;
  const circumference = 2*Math.PI*r;
  const offset = circumference - (pct/100)*circumference;
  const dateStr = now.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  const dayStr = weekdayName(now);

  const heightBtn = DATA.height ? `${DATA.height} cm` : 'Tap to set';
  const weightBtn = DATA.weight ? `${DATA.weight} kg` : 'Tap to set';

  return `
  <div class="hero">
    <div class="hero-date">${dateStr}</div>
    <div class="hero-day">${dayStr}</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="${r}"></circle>
        <circle class="ring-fill" cx="100" cy="100" r="${r}"
          stroke-dasharray="${circumference}" stroke-dashoffset="${comp.totalSets===0 ? circumference : offset}"></circle>
      </svg>
      <div class="ring-center">
        <div class="ring-pct">${comp.totalSets===0 ? '—' : pct+'%'}</div>
        <div class="ring-sub">${comp.totalSets===0 ? 'Rest day' : comp.completedSets+' / '+comp.totalSets+' sets'}</div>
      </div>
    </div>
    <button class="hero-cta" id="btnToday">${ICONS.play}View today's workout</button>
  </div>

  <p class="section-label">Track</p>
  <div class="grid">
    <button class="tile" data-nav="/workouts">
      <div class="tile-icon">${ICONS.dumbbell}</div>
      <div><div class="tile-label">Workouts</div><div class="tile-value">${DAYS.filter(d=>DATA.weekPlan[d].length).length}/7 days planned</div></div>
    </button>
    <button class="tile" data-nav="/stretches">
      <div class="tile-icon">${ICONS.stretch}</div>
      <div><div class="tile-label">Stretches</div><div class="tile-value">Daily &amp; per-day</div></div>
    </button>
    <button class="tile" data-nav="/warmup">
      <div class="tile-icon">${ICONS.flame}</div>
      <div><div class="tile-label">Warm-up</div><div class="tile-value">${DATA.warmup.length} exercises</div></div>
    </button>
    <button class="tile" data-nav="/posture">
      <div class="tile-icon">${ICONS.spine}</div>
      <div><div class="tile-label">Posture</div><div class="tile-value">${DATA.posture.length} exercises</div></div>
    </button>
    <button class="tile" data-nav="/jaw">
      <div class="tile-icon">${ICONS.jaw}</div>
      <div><div class="tile-label">Jaw</div><div class="tile-value">${DATA.jaw.length} exercises</div></div>
    </button>
    <button class="tile" data-nav="/weights">
      <div class="tile-icon">${ICONS.barbell}</div>
      <div><div class="tile-label">Lift log</div><div class="tile-value">${DATA.weights.length} logged</div></div>
    </button>
  </div>

  <p class="section-label">Measurements</p>
  <div class="grid">
    <button class="tile" id="btnHeight">
      <div class="tile-icon">${ICONS.ruler}</div>
      <div class="measure-row" style="width:100%;"><div class="tile-label">Height</div></div>
      <div class="measure-val ${DATA.height?'':'empty'}">${heightBtn}</div>
    </button>
    <button class="tile" id="btnWeight">
      <div class="tile-icon">${ICONS.ruler}</div>
      <div class="measure-row" style="width:100%;"><div class="tile-label">Weight</div></div>
      <div class="measure-val ${DATA.weight?'':'empty'}">${weightBtn}</div>
    </button>
    <button class="tile" data-nav="/measurements/body" style="grid-column:1 / -1;">
      <div class="tile-icon">${ICONS.ruler}</div>
      <div><div class="tile-label">Body measurements</div><div class="tile-value">${DATA.bodyMeasures.length} parts logged</div></div>
    </button>
  </div>

  ${renderCalendar()}
  `;
}

function renderCalendar(){
  const year = calViewDate.getFullYear();
  const month = calViewDate.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday-start
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = calViewDate.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  const now = todayDate();

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell"><div class="cal-dot empty"></div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const comp = dayCompletion(dt);
    let cls = '';
    if(comp.pct === 100) cls = 'full';
    else if(comp.pct !== null && comp.pct >= 50) cls = 'outline';
    const isToday = dateKey(dt) === dateKey(now);
    cells += `<div class="cal-cell"><div class="cal-dot ${cls} ${isToday?'today':''}">${d}</div></div>`;
  }

  return `
  <div class="cal-card">
    <div class="cal-head">
      <div class="cal-title">${monthLabel}</div>
      <div class="cal-nav">
        <button id="calPrev">${ICONS.chevLeft}</button>
        <button id="calNext">${ICONS.chevRight}</button>
      </div>
    </div>
    <div class="cal-weekdays">${DAYS_SHORT.map(d=>`<span>${d[0]}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <div class="cal-legend-item"><span class="legend-swatch full"></span>100% complete</div>
      <div class="cal-legend-item"><span class="legend-swatch outline"></span>50%+ complete</div>
      <div class="cal-legend-item"><span class="legend-swatch empty"></span>Below 50%</div>
    </div>
  </div>`;
}

/* ============================= TODAY VIEW ============================= */
function viewToday(){
  const now = todayDate();
  const wd = weekdayName(now);
  const plan = DATA.weekPlan[wd] || [];
  const key = dateKey(now);
  if(!DATA.dailyLogs[key]) DATA.dailyLogs[key] = {};
  const log = DATA.dailyLogs[key];

  if(plan.length === 0){
    return `
    <h1 class="page-title">${wd}</h1>
    <div class="empty-state">No exercises planned for ${wd} yet.<br>Add your plan from the Workouts page.</div>
    <button class="add-btn" data-nav="/workouts/${encodeURIComponent(wd)}">${ICONS.pencil} Set up ${wd}'s plan</button>
    `;
  }

  const rows = plan.map(ex=>{
    const sets = parseInt(ex.sets)||0;
    const done = Math.min(log[ex.id]||0, sets);
    let pills = '';
    for(let i=0;i<sets;i++){
      pills += `<button class="set-pill ${i<done?'done':''}" data-toggle-set data-ex="${ex.id}" data-idx="${i}">${i<done?'✓':i+1}</button>`;
    }
    return `
    <div class="ex-row">
      <div class="ex-top">
        <div>
          <div class="ex-name">${escapeHTML(ex.name)}</div>
          <div class="ex-meta">${sets} sets × ${escapeHTML(ex.reps||'—')} reps</div>
        </div>
      </div>
      <div class="set-pills">${pills}</div>
    </div>`;
  }).join('');

  return `
  <h1 class="page-title">${wd}'s workout</h1>
  <div class="list" style="margin-bottom:8px;">${rows}</div>
  <button class="add-btn" data-nav="/workouts/${encodeURIComponent(wd)}">${ICONS.pencil} Edit this day's plan</button>
  `;
}

/* ============================= WORKOUTS ============================= */
function viewWorkoutsList(){
  const now = todayDate();
  const todayName = weekdayName(now);
  const rows = DAYS.map(d=>{
    const plan = DATA.weekPlan[d];
    const totalSets = plan.reduce((s,ex)=> s+(parseInt(ex.sets)||0),0);
    return `
    <div class="row-card">
      <button class="day-btn" data-nav="/workouts/${encodeURIComponent(d)}">
        <div class="row-main">
          <div class="row-title">${d} ${d===todayName?'<span style=\"color:var(--accent-2); font-size:12px; font-weight:700;\"> · today</span>':''}</div>
          <div class="row-sub">${plan.length ? plan.length+' exercises · '+totalSets+' sets' : 'No plan yet'}</div>
        </div>
        <div class="row-chev">${ICONS.chevron}</div>
      </button>
    </div>`;
  }).join('');
  return `<h1 class="page-title">Workouts</h1><div class="list">${rows}</div>`;
}

function viewWorkoutDay(day){
  const plan = DATA.weekPlan[day] || (DATA.weekPlan[day]=[]);
  const rows = plan.map(ex=>`
    <div class="ex-row" data-plan-item="${ex.id}">
      <div class="field-row">
        <div class="field" style="flex:2;"><label>Exercise</label><input type="text" value="${escapeHTML(ex.name)}" data-field="name"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Sets</label><input type="number" min="0" value="${escapeHTML(ex.sets)}" data-field="sets"></div>
        <div class="field"><label>Reps</label><input type="text" value="${escapeHTML(ex.reps)}" data-field="reps"></div>
      </div>
      <button class="add-btn" style="border-style:solid; color:var(--danger); border-color:var(--border-strong); margin-bottom:0;" data-remove-plan-item="${ex.id}">${ICONS.trash} Remove</button>
    </div>
  `).join('');

  return `
  <h1 class="page-title">${day}</h1>
  <div id="planItems">${rows || '<div class="empty-state">No exercises yet — add your first one below.</div>'}</div>
  <button class="add-btn" id="btnAddExercise">${ICONS.plus} Add exercise</button>
  <div class="save-bar"><button class="save-btn" id="btnSaveDay">Save changes</button></div>
  `;
}

/* ============================= STRETCHES ============================= */
function viewStretchesList(){
  const keys = [...DAYS, 'Daily'];
  const chips = keys.map(k=>{
    const count = (DATA.stretches[k]||[]).length;
    return `
    <button class="tile" data-nav="/stretches/${encodeURIComponent(k)}">
      <div class="tile-icon">${ICONS.stretch}</div>
      <div><div class="tile-label">${k}</div><div class="tile-value">${count} stretch${count===1?'':'es'}</div></div>
    </button>`;
  }).join('');
  return `<h1 class="page-title">Stretches</h1><div class="chip-grid">${chips}</div>`;
}

/* ============================= GENERIC SIMPLE LIST (warmup/posture/jaw/stretch-day) ============================= */
function viewSimpleList(key, arr, labels){
  const rows = arr.map(item=>`
    <div class="ex-row" data-item="${item.id}">
      <div class="field-row">
        <div class="field"><label>${labels.name}</label><input type="text" value="${escapeHTML(item.name)}" data-field="name"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Detail</label><input type="text" placeholder="${labels.detail}" value="${escapeHTML(item.detail||'')}" data-field="detail"></div>
      </div>
      <button class="add-btn" style="border-style:solid; color:var(--danger); border-color:var(--border-strong); margin-bottom:0;" data-remove-item="${item.id}">${ICONS.trash} Remove</button>
    </div>
  `).join('');

  return `
  <h1 class="page-title">Edit list</h1>
  <div id="simpleItems" data-key="${key}">${rows || '<div class="empty-state">Nothing here yet — add your first item.</div>'}</div>
  <button class="add-btn" id="btnAddSimple">${ICONS.plus} Add item</button>
  <div class="save-bar"><button class="save-btn" id="btnSaveSimple">Save changes</button></div>
  `;
}

function resolveSimpleArray(key){
  if(key === 'warmup') return DATA.warmup;
  if(key === 'posture') return DATA.posture;
  if(key === 'jaw') return DATA.jaw;
  if(key.indexOf('stretches_') === 0){
    const day = key.slice('stretches_'.length);
    return DATA.stretches[day] || (DATA.stretches[day]=[]);
  }
  return [];
}

/* ============================= MODAL (numeric quick-edit) ============================= */
function openNumberModal(title, currentVal, unit, onSave){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-backdrop" id="mBackdrop">
    <div class="modal">
      <div class="modal-title">${escapeHTML(title)}</div>
      <div class="field"><label>Value (${unit})</label><input type="number" step="0.1" id="mInput" value="${currentVal!=null?currentVal:''}"></div>
      <div class="modal-actions">
        <button class="modal-btn ghost" id="mCancel">Cancel</button>
        <button class="modal-btn primary" id="mSave">Save</button>
      </div>
    </div>
  </div>`;
  const backdrop = document.getElementById('mBackdrop');
  requestAnimationFrame(()=> backdrop.classList.add('open'));
  const close = ()=>{ backdrop.classList.remove('open'); setTimeout(()=> root.innerHTML='', 200); };
  document.getElementById('mCancel').onclick = close;
  backdrop.onclick = (e)=>{ if(e.target===backdrop) close(); };
  document.getElementById('mSave').onclick = ()=>{
    const v = document.getElementById('mInput').value;
    onSave(v === '' ? null : v);
    close();
  };
  document.getElementById('mInput').focus();
}

/* ============================= EVENT HANDLERS ============================= */
function attachHandlers(root, parts){
  document.getElementById('btnBack')?.addEventListener('click', ()=> history.back());

  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> nav(el.getAttribute('data-nav')));
  });

  document.getElementById('btnToday')?.addEventListener('click', ()=> nav('/today'));

  /* ---- Home calendar nav ---- */
  document.getElementById('calPrev')?.addEventListener('click', ()=>{
    calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth()-1, 1);
    render();
  });
  document.getElementById('calNext')?.addEventListener('click', ()=>{
    calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth()+1, 1);
    render();
  });

  /* ---- Height / Weight quick modals ---- */
  const openHeight = ()=> openNumberModal('Height', DATA.height, 'cm', v=>{ DATA.height=v; saveData(); render(); showToast('Height saved'); });
  const openWeight = ()=> openNumberModal('Weight', DATA.weight, 'kg', v=>{ DATA.weight=v; saveData(); render(); showToast('Weight saved'); });
  document.getElementById('btnHeight')?.addEventListener('click', openHeight);
  document.getElementById('btnWeight')?.addEventListener('click', openWeight);
  document.getElementById('btnHeight2')?.addEventListener('click', openHeight);
  document.getElementById('btnWeight2')?.addEventListener('click', openWeight);

  /* ---- Today: toggle set pills ---- */
  document.querySelectorAll('[data-toggle-set]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId = btn.getAttribute('data-ex');
      const idx = parseInt(btn.getAttribute('data-idx'));
      const key = dateKey(todayDate());
      if(!DATA.dailyLogs[key]) DATA.dailyLogs[key] = {};
      const log = DATA.dailyLogs[key];
      const cur = log[exId]||0;
      log[exId] = (idx < cur) ? idx : idx+1;
      saveData();
      render();
    });
  });

  /* ---- Workout day editor ---- */
  if(root === 'workouts' && parts[1]){
    const day = decodeURIComponent(parts[1]);
    document.getElementById('btnAddExercise')?.addEventListener('click', ()=>{
      DATA.weekPlan[day].push({id:uid(), name:'New exercise', sets:'3', reps:'10'});
      render();
    });
    document.querySelectorAll('[data-remove-plan-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-remove-plan-item');
        DATA.weekPlan[day] = DATA.weekPlan[day].filter(e=>e.id!==id);
        render();
      });
    });
    document.getElementById('btnSaveDay')?.addEventListener('click', ()=>{
      document.querySelectorAll('#planItems [data-plan-item]').forEach(row=>{
        const id = row.getAttribute('data-plan-item');
        const item = DATA.weekPlan[day].find(e=>e.id===id);
        if(!item) return;
        row.querySelectorAll('[data-field]').forEach(inp=>{
          item[inp.getAttribute('data-field')] = inp.value;
        });
      });
      saveData();
      showToast('Plan saved');
      nav('/workouts');
    });
  }

  /* ---- Generic simple list editor (warmup/posture/jaw/stretch-day) ---- */
  const simpleWrap = document.getElementById('simpleItems');
  if(simpleWrap){
    const key = simpleWrap.getAttribute('data-key');
    document.getElementById('btnAddSimple')?.addEventListener('click', ()=>{
      resolveSimpleArray(key).push({id:uid(), name:'New item', detail:''});
      render();
    });
    document.querySelectorAll('[data-remove-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-remove-item');
        const arr = resolveSimpleArray(key);
        const idx = arr.findIndex(i=>i.id===id);
        if(idx>-1) arr.splice(idx,1);
        render();
      });
    });
    document.getElementById('btnSaveSimple')?.addEventListener('click', ()=>{
      const arr = resolveSimpleArray(key);
      document.querySelectorAll('#simpleItems [data-item]').forEach(row=>{
        const id = row.getAttribute('data-item');
        const item = arr.find(i=>i.id===id);
        if(!item) return;
        row.querySelectorAll('[data-field]').forEach(inp=>{
          item[inp.getAttribute('data-field')] = inp.value;
        });
      });
      saveData();
      showToast('Saved');
      history.back();
    });
  }

  /* ---- Body measures editor ---- */
  if(root === 'measurements' && parts[1]==='body'){
    document.getElementById('btnAddBody')?.addEventListener('click', ()=>{
      DATA.bodyMeasures.push({id:uid(), part:'New part', cm:''});
      render();
    });
    document.querySelectorAll('[data-remove-body]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-remove-body');
        DATA.bodyMeasures = DATA.bodyMeasures.filter(i=>i.id!==id);
        render();
      });
    });
    document.getElementById('btnSaveBody')?.addEventListener('click', ()=>{
      document.querySelectorAll('#bodyItems [data-item]').forEach(row=>{
        const id = row.getAttribute('data-item');
        const item = DATA.bodyMeasures.find(i=>i.id===id);
        if(!item) return;
        row.querySelectorAll('[data-field]').forEach(inp=>{
          item[inp.getAttribute('data-field')] = inp.value;
        });
      });
      saveData();
      showToast('Saved');
      nav('/measurements');
    });
  }

  /* ---- Weights / lift log editor ---- */
  if(root === 'weights'){
    document.getElementById('btnAddWeight')?.addEventListener('click', ()=>{
      DATA.weights.push({id:uid(), name:'New exercise', type:'weight', weight:'', sets:'3', reps:'10'});
      render();
    });
    document.querySelectorAll('[data-remove-weight]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-remove-weight');
        DATA.weights = DATA.weights.filter(i=>i.id!==id);
        render();
      });
    });
    document.querySelectorAll('[data-type-toggle]').forEach(toggle=>{
      toggle.querySelectorAll('button').forEach(b=>{
        b.addEventListener('click', ()=>{
          toggle.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          const row = toggle.closest('.ex-row');
          const isWeight = b.getAttribute('data-type')==='weight';
          row.querySelector('[data-fields-weight]').style.display = isWeight ? '' : 'none';
          row.querySelector('[data-fields-setsreps]').style.display = isWeight ? 'none' : '';
        });
      });
    });
    document.getElementById('btnSaveWeight')?.addEventListener('click', ()=>{
      document.querySelectorAll('#weightItems [data-item]').forEach(row=>{
        const id = row.getAttribute('data-item');
        const item = DATA.weights.find(i=>i.id===id);
        if(!item) return;
        const activeType = row.querySelector('[data-type-toggle] button.active')?.getAttribute('data-type') || item.type;
        item.type = activeType;
        row.querySelectorAll('[data-field]').forEach(inp=>{
          item[inp.getAttribute('data-field')] = inp.value;
        });
      });
      saveData();
      showToast('Saved');
      nav('/home');
    });
  }
}
</script>
</body>
</html>
